<svg width="100%" viewBox="0 0 680 960" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="18"
        flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="680" height="960" fill="#be9633"/>

  <!-- SUBTLE TEXTURE -->
  <g opacity="0.05" fill="#ffffff">
    <circle cx="120" cy="160" r="20"/>
    <circle cx="140" cy="160" r="10"/>
    <circle cx="130" cy="140" r="10"/>

    <circle cx="560" cy="200" r="20"/>
    <circle cx="580" cy="200" r="10"/>
    <circle cx="570" cy="180" r="10"/>

    <circle cx="140" cy="820" r="20"/>
    <circle cx="160" cy="820" r="10"/>
    <circle cx="150" cy="800" r="10"/>

    <circle cx="540" cy="820" r="20"/>
    <circle cx="560" cy="820" r="10"/>
    <circle cx="550" cy="800" r="10"/>
  </g>

  <!-- HANGER -->
  <rect x="290" y="85" width="100" height="14"
    fill="#fffaf0" rx="4"/>

  <!-- CARD -->
  <rect x="56" y="110" width="568" height="780" rx="14"
    fill="#ffffff"
    stroke="#f3e2b0"
    filter="url(#shadow)"/>

  <!-- FLORAL CORNERS -->
  <g fill="#be9633" opacity="0.35">
    <circle cx="95" cy="145" r="6"/>
    <circle cx="105" cy="135" r="4"/>
    <circle cx="115" cy="145" r="6"/>
    <circle cx="105" cy="155" r="4"/>

    <circle cx="585" cy="145" r="6"/>
    <circle cx="595" cy="135" r="4"/>
    <circle cx="605" cy="145" r="6"/>
    <circle cx="595" cy="155" r="4"/>

    <circle cx="95" cy="830" r="6"/>
    <circle cx="105" cy="820" r="4"/>
    <circle cx="115" cy="830" r="6"/>
    <circle cx="105" cy="840" r="4"/>

    <circle cx="585" cy="830" r="6"/>
    <circle cx="595" cy="820" r="4"/>
    <circle cx="605" cy="830" r="6"/>
    <circle cx="595" cy="840" r="4"/>
  </g>

  <!-- STARS -->
  <g fill="#be9633">
    <path d="M280,155 L283,164 L292,164 L285,170 L288,179 L280,173 L272,179 L275,170 L268,164 L277,164 Z"/>
    <path d="M310,155 L313,164 L322,164 L315,170 L318,179 L310,173 L302,179 L305,170 L298,164 L307,164 Z"/>
    <path d="M340,155 L343,164 L352,164 L345,170 L348,179 L340,173 L332,179 L335,170 L328,164 L337,164 Z"/>
    <path d="M370,155 L373,164 L382,164 L375,170 L378,179 L370,173 L362,179 L365,170 L358,164 L367,164 Z"/>
    <path d="M400,155 L403,164 L412,164 L405,170 L408,179 L400,173 L392,179 L395,170 L388,164 L397,164 Z"/>
  </g>

  <!-- BLOCK 1 -->
  <text x="340" y="230"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#1a1a1a">

    <tspan x="340" dy="0">Your story isn’t just a story —</tspan>
    <tspan x="340" dy="22">it’s a bold, mission-driven journey</tspan>
    <tspan x="340" dy="22">of resilience and defying the odds.</tspan>
    <tspan x="340" dy="22">Your originality and fearless energy</tspan>
    <tspan x="340" dy="22">are a breath of fresh air.</tspan>

    <tspan x="340" dy="26"
      font-weight="700"
      fill="#8e6f24">
      A living testament to authenticity.
    </tspan>

  </text>

  <!-- BLOCK 2 -->
  <text x="340" y="420"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#1a1a1a">

    <tspan x="340" dy="0">Your work goes far beyond books —</tspan>
    <tspan x="340" dy="22">it’s an invitation into a revolution.</tspan>
    <tspan x="340" dy="22">You don’t just guide people,</tspan>
    <tspan x="340" dy="22">you unlock their truth, power</tspan>
    <tspan x="340" dy="22">and authentic voice.</tspan>

    <tspan x="340" dy="26"
      font-weight="700"
      fill="#8e6f24">
      Transforming people into powerhouses.
    </tspan>

  </text>

  <!-- DIVIDER -->
  <line x1="150" y1="600" x2="530" y2="600"
    stroke="#8e6f24" stroke-opacity="0.25"/>

  <!-- BLOCK 3 -->
  <text x="340" y="640"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#1a1a1a">

    <tspan x="340" dy="0">Working with you is not just guidance —</tspan>
    <tspan x="340" dy="22">it’s an EPIC journey of transformation.</tspan>

    <tspan x="340" dy="26"
      font-weight="700"
      fill="#8e6f24">
      A catalyst for profound change.
    </tspan>

    <tspan x="340" dy="22">I’m a fan for life.</tspan>

  </text>

  <!-- SIGNATURE -->
  <text x="340" y="865"
    text-anchor="middle"
    font-family="cursive"
    font-size="46"
    fill="#8e6f24">
    Nicole
  </text>

</svg>