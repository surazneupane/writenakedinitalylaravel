      <stop offset="0%" stop-color="#8e6f24" />
      <stop offset="50%" stop-color="#be9633" />
      <stop offset="100%" stop-color="#d4b761" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- TOP GOLD LINE -->
