  <!-- QUOTE -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="80" fill="#be9633" opacity="0.15">"</text>

  <!-- BLOCK 1 -->
  <text x="340" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">

    <tspan x="340" dy="0">I had the pleasure of working with Mirav to optimize the</tspan>
    <tspan x="340" dy="22">visibility of my book on Amazon, and I must say that her</tspan>
    <tspan x="340" dy="22">that her expertise and dedication made an extraordinary</tspan>

    <tspan x="340" dy="26" font-style="normal" font-weight="700" fill="#8e6f24">
      difference in my publishing journey.
    </tspan>

  </text>

  <!-- DIVIDER -->
  <line x1="150" y1="300" x2="530" y2="300" stroke="#be9633" stroke-opacity="0.25" />

  <!-- BLOCK 2 -->
  <text x="340" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">

    <tspan x="340" dy="0">From the fist meeting, Mirav demonstrated herself to be highly </tspan>
    <tspan x="340" dy="22">knowledgeable and passionate about the world of publishing on</tspan>
    <tspan x="340" dy="22">Amazon. She has demonstrated a deep understanding of the</tspan>
    <tspan x="340" dy="22">mechanisms that govern the platform and knows how to make</tspan>
    <tspan x="340" dy="22"> a book stand out among the myriad of titles present. What struck</tspan>
    <tspan x="340" dy="22"> me most was her availability. Mirav was always ready to answer </tspan>
    <tspan x="340" dy="22">my questions, clarify my doubts and offer valuable suggestions.</tspan>
    <tspan x="340" dy="22"> Her patience in walking me through every </tspan>
    <tspan x="340" dy="22"></tspan>


    <tspan x="340" dy="26" font-style="normal" font-weight="700" fill="#8e6f24">
      step of the process was invaluable.
    </tspan>

  </text>

  <!-- DIVIDER -->
  <line x1="150" y1="530" x2="530" y2="530" stroke="#be9633" stroke-opacity="0.25" />

  <!-- BLOCK 3 -->
  <text x="340" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">

    <tspan x="340" dy="22">Thanks to Mirav’s expertise, my book began to climb the Amazon</tspan>
    <tspan x="340" dy="22">rankings significantly. Not only did it optimize my book’s positioning,</tspan>
    <tspan x="340" dy="22">but it also provided valuable marketing and promotion strategies that</tspan>
    <tspan x="340" dy="22"> helped reach a broader audience. Ultimately, Mirav is an amazing</tspan>

    <tspan x="340" dy="22"> resource for anyone looking to succeed on Amazon. Her expertise,</tspan>
    <tspan x="340" dy="22"> helpfulness and passion for her clients’ success are evident every</tspan>
    <tspan x="340" dy="22">step of the way. I highly recommend her service to anyone with</tspan>
    <tspan x="340" dy="22" font-style="normal" font-weight="700" fill="#8e6f24">Amazon publishing aspirations with publishing ambitions..</tspan>


  </text>

  <!-- CLOSING QUOTE -->
  <text x="590" y="760" font-family="Georgia, serif" font-size="80" fill="#be9633" opacity="0.15"
    text-anchor="end">"</text>

  <!-- THANK YOU -->
  <text x="340" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">
    Thank you again, Mirav, for your exceptional support in my
  </text>
  <text x="340" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">
     editorial journey. I look forward to continuing to
  </text>
  <text x="340" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="15.2" fill="#1f1f1f"
    font-style="italic">
    work with you to reach new heights.
  </text>

  <!-- SIGNATURE LINE -->
  <line x1="270" y1="815" x2="410" y2="815" stroke="#be9633" stroke-opacity="0.4" />

  <!-- SIGNATURE -->
  <text x="340" y="865" text-anchor="middle" font-family="cursive" font-size="46" fill="#8e6f24">
    Nicola
  </text>

</svg>