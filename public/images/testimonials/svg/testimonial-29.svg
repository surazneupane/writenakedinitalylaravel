<svg width="100%" viewBox="0 0 680 960" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8e6f24" />
            <stop offset="50%" stop-color="#be9633" />
            <stop offset="100%" stop-color="#d4b761" />
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.12" />
        </filter>
    </defs>

    <!-- TOP GOLD LINE -->
    <rect x="0" y="0" width="680" height="3" fill="url(#goldGrad)" />

    <!-- HANGER -->
    <rect x="290" y="85" width="100" height="14" fill="#fdfdfb" stroke="#e6e6e6" rx="4" />

    <!-- CARD -->
    <rect x="56" y="110" width="568" height="780" rx="12" fill="#ffffff" stroke="#eeeeee" filter="url(#shadow)" />

    <!-- TOP BORDER -->
    <rect x="56" y="110" width="568" height="3" fill="url(#goldGrad)" />

    <!-- STARS -->
    <g fill="#be9633">
        <path d="M280,155 L283,164 L292,164 L285,170 L288,179 L280,173 L272,179 L275,170 L268,164 L277,164 Z" />
        <path d="M310,155 L313,164 L322,164 L315,170 L318,179 L310,173 L302,179 L305,170 L298,164 L307,164 Z" />
        <path d="M340,155 L343,164 L352,164 L345,170 L348,179 L340,173 L332,179 L335,170 L328,164 L337,164 Z" />
        <path d="M370,155 L373,164 L382,164 L375,170 L378,179 L370,173 L362,179 L365,170 L358,164 L367,164 Z" />
        <path d="M400,155 L403,164 L412,164 L405,170 L408,179 L400,173 L392,179 L395,170 L388,164 L397,164 Z" />
    </g>

    <!-- QUOTE -->
    <text x="80" y="240" font-family="Georgia, serif" font-size="80" fill="#be9633" opacity="0.15">"</text>

    <!-- BLOCK 1 -->
    <text x="340" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">

        <tspan x="340" dy="0">What my sessions with Mirav have given me.</tspan>

        <tspan x="340" dy="22">As a spiritual worker I was well aware that I was not keeping</tspan>
        <tspan x="340" dy="22">myself as physically fit as I would like. I had become aware</tspan>
        <tspan x="340" dy="22">of general aches and pains and how I was finding it </tspan>
        <tspan x="340" dy="22">difficult to get up off the floor when </tspan>
        <tspan x="340" dy="24" font-style="normal" font-weight="700" fill="#8e6f24">I had been sat playing with my
            grandchildren.</tspan>

    </text>

    <!-- DIVIDER -->
    <line x1="150" y1="400" x2="530" y2="400" stroke="#be9633" stroke-opacity="0.25" />

    <!-- BLOCK 2 -->
    <text x="340" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">

        <tspan x="340" dy="0">I joined a five day challenge with Mirav and discovered the</tspan>
        <tspan x="340" dy="22">perfect formula for me. Her power shots set me up for the day,</tspan>
        <tspan x="340" dy="22"> emotionally and physically. I use the session to check in with my </tspan>
        <tspan x="340" dy="22">alignment. The format of the session is what I love the most. I am</tspan>


        <tspan x="340" dy="22">never bored. I never know what Mirav will come up with next </tspan>
        <tspan x="340" dy="22" font-style="normal" font-weight="700" fill="#8e6f24">to keep us stimulated and physically
            fit.</tspan>

    </text>

    <!-- DIVIDER -->
    <line x1="150" y1="580" x2="530" y2="580" stroke="#be9633" stroke-opacity="0.25" />

    <!-- BLOCK 3 -->
    <text x="340" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">

        <tspan x="340" dy="0">I’ve learnt face yoga, eye yoga, Krav Maga, toned my arms,</tspan>
        <tspan x="340" dy="22">butt and other places, and now look forward to the famous </tspan>
        <tspan x="340" dy="22">45 second wiggle. My face and body have both toned up and </tspan>
        <tspan x="340" dy="22" font-style="normal" font-weight="700" fill="#8e6f24">I feel physically stronger.  I have met some lovely people,
        </tspan>
        <tspan x="340" dy="22" font-style="normal" font-weight="700" fill="#8e6f24">and
            found a way to keep fit that suits me.</tspan>

    </text>

    <!-- CLOSING QUOTE -->
    <text x="590" y="70" font-family="Georgia, serif" font-size="80" fill="#be9633" opacity="0.15"
        text-anchor="end">"</text>

    <!-- THANK YOU -->
    <text x="340" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">
        I would recommend Miravs power shots for anyone like myself 
    </text>
    <text x="340" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">
        looking for a fun and flexible way to keep fit with a bunch of</text>
    <text x="340" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1f1f"
        font-style="italic">
         spiritual and likeminded people.
    </text>

    <!-- SIGNATURE LINE -->
    <line x1="270" y1="815" x2="410" y2="815" stroke="#be9633" stroke-opacity="0.4" />

    <!-- SIGNATURE -->
    <text x="340" y="865" text-anchor="middle" font-family="cursive" font-size="42" fill="#8e6f24">
        Wendy Panther
    </text>

</svg>